<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>MapTree temporariamente indisponível</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #183b2c;
        background: #f4f7f4;
      }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 560px); padding: clamp(28px, 7vw, 56px); border: 1px solid #d5e1d8; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 18px 60px #183b2c14; }
      img { display: block; width: 184px; max-width: 70%; height: auto; margin: 0 auto 32px; }
      h1 { margin: 0; font-size: clamp(1.75rem, 6vw, 2.5rem); line-height: 1.15; }
      p { margin: 16px 0 28px; color: #4e6257; font-size: 1rem; line-height: 1.65; }
      button { min-height: 48px; padding: 12px 22px; border: 0; border-radius: 12px; background: #005657; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #7fbd45; outline-offset: 4px; }
      @media (prefers-reduced-motion: no-preference) { button { transition: background-color 140ms ease; } button:hover { background: #007f43; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/LogoMapTree.png" alt="MapTree" width="512" height="512" />
      <h1>Estamos trabalhando para voltar.</h1>
      <p>O MapTree está temporariamente indisponível. Tente novamente em alguns instantes.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
